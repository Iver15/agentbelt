<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Настройки</title>
<style>
:root{--bg:#14161a;--card:#1a1e24;--fg:#d8dce3;--mut:#7d8590;--line:#2a2f37;--ok:#3fb950;--bad:#f85149;--warn:#d29922;--acc:#58a6ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:12px/1.5 -apple-system,BlinkMacSystemFont,"SF Mono",Menlo,monospace}
.s{padding:10px;border-bottom:1px solid var(--line);animation:in .2s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h3{margin:0 0 6px;font-size:11px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.mut{color:var(--mut)}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}a{color:var(--acc)}
label.f{display:block;margin:6px 0 2px;color:var(--mut)}
input[type=text],input[type=password],textarea{width:100%;background:#0e1013;color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:5px 7px;font:11px/1.4 "SF Mono",Menlo,monospace}
textarea{min-height:110px;resize:vertical}
select{background:#0e1013;color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:4px 6px;font:11px "SF Mono",Menlo,monospace}
.row{display:flex;gap:6px;align-items:center}.sp{flex:1}
.chip{cursor:pointer;padding:1px 8px;border-radius:9px;border:1px solid var(--line);color:var(--mut)}.chip.on{color:var(--fg);border-color:var(--acc)}
button{background:#1f2a3a;color:var(--acc);border:1px solid var(--line);border-radius:5px;padding:4px 12px;cursor:pointer;font:inherit}button:hover{border-color:var(--acc)}button.main{color:var(--ok);border-color:var(--ok)}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px}
.step{display:flex;gap:8px;margin:6px 0}.num{flex:none;width:18px;height:18px;border-radius:9px;background:#1f2a3a;color:var(--acc);display:flex;align-items:center;justify-content:center;font-size:10px}
pre{margin:4px 0 0;font:11px/1.35 "SF Mono",Menlo,monospace;white-space:pre-wrap;word-break:break-all;background:#0e1013;padding:6px;border-radius:4px}
#bar{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:8px 10px;display:flex;gap:8px;align-items:center}
</style></head><body><div id="app" class="s mut">Загрузка…</div>
<div id="bar"><a href="/sessions" style="color:var(--acc);text-decoration:none">← к сессиям</a><button class="main" id="save">Сохранить</button><span id="msg" class="mut"></span></div>
<script>
let C=null, V=null;
const e=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const maskUrl=s=>String(s||"").replace(/(:\/\/[^:\/\s@]+):([^@\s]+)@/g,"$1:***@");
const TABS={git:"Git и PR",agent:"Действия агента",sessions:"Сессии",settings:"Настройки"};
const EXTRA_AGENTS=[["pi","pi","pi --session <id>"],["omp","omp","omp -r <id>"]];
const via=a=>a.proxy==="direct"?"env -u HTTPS_PROXY …":a.proxy?`HTTPS_PROXY=<${a.proxy}>`:a.prefix;
function preview(){const a=C.agents.claude, x=C.agents.codex;
  const cl=[via(a),"claude --resume <id>",(a.flags||"").replace("--dangerously-skip-permissions","").trim(),a.skip_permissions?"--dangerously-skip-permissions":""].filter(Boolean).join(" ");
  const cx=[via(x),"codex resume <id>",x.flags].filter(Boolean).join(" ");
  const other=EXTRA_AGENTS.map(([key,,cmd])=>[via(C.agents[key]),cmd,C.agents[key].flags].filter(Boolean).join(" "));
  document.getElementById("pv").textContent=maskUrl("cd <dir> && "+[cl,cx,...other].join("\ncd <dir> && "))}
function pick(id,cur){const names=["direct",...(C.proxies||[]).map(p=>p.name)];
  return `<select id="${id}"><option value="">— использовать префикс выше —</option>${names.map(n=>`<option value="${e(n)}" ${n===cur?"selected":""}>${e(n==="direct"?"напрямую":n)}</option>`).join("")}</select>`}
const pxRow=p=>`<div class="row px" data-orig="${e(p.name||"")}" style="margin-top:4px"><input type="text" class="pn" placeholder="название" value="${e(p.name||"")}" style="width:110px"><input type="text" class="pu" placeholder="http://user:pass@host:port" value="${e(p.url||"")}"><span class="chip del" title="Удалить">✕</span></div>`;
const svRow=s=>`<div class="row sv" style="margin-top:4px"><input type="text" class="sn" placeholder="название" value="${e(s.name||"")}" style="width:110px"><input type="text" class="sh" placeholder="адрес сервера" value="${e(s.host||"")}"><input type="text" class="sp2" placeholder="22" value="${e(s.port||"")}" style="width:56px"><label class="row mut" title="Читать SSH-приветствие"><input type="checkbox" class="sb" ${s.banner===false?"":"checked"}>приветствие</label><span class="chip del" title="Удалить">✕</span></div>`;
function render(d){C=d.config;
  let h="";
  h+=`<div class="s" id="hello"><h3>Как это работает</h3><div class="card">
   <div>agentbelt добавляет вкладки для AI-агентов в боковую панель Toolbelt в iTerm2. Они следуют за активной областью терминала.</div>
   <div class="step"><span class="num">1</span><span><b>Вкладки</b>: в View → Toolbelt включите инструменты с префиксом «${e(C.title_prefix)}». Настройки открываются по ⚙ во вкладке «Сессии». Показать или скрыть панель: ⌘⇧B.</span></div>
   <div class="step"><span class="num">2</span><span><b>Git и PR</b>: ветка, отставание от main, изменения файлов по клику, PR и CI через <code>gh</code>.</span></div>
   <div class="step"><span class="num">3</span><span><b>Действия агента</b>: команды, правки, чтение и поиск Claude Code в активной области. Распространённые формы паролей и токенов маскируются.</span></div>
   <div class="step"><span class="num">4</span><span><b>Сессии</b>: Claude Code, Codex, pi и omp, проекты в виде карточек. «Продолжить» открывает сессию; «Запущено» позволяет перейти к работающему агенту; снимки сохраняют и восстанавливают окна.</span></div>
   <div class="step"><span class="num">5</span><span>Если агентам нужны прокси или дополнительные параметры, заполните блок запуска агентов ниже.</span></div>
   ${C.onboarded?'<div class="ok">Инструкция прочитана</div>':'<button id="done">Понятно</button>'}</div></div>`;
  h+=`<div class="s" id="agents"><h3>Агенты: параметры запуска</h3>
   <div class="card"><b>Claude Code</b>
    <label class="f">Префикс команды (например, HTTPS_PROXY='http://user:pass@host:port')</label>
    <div class="row"><input type="password" id="cl_prefix" value="${e(C.agents.claude.prefix)}"><span class="chip" id="show">показать</span></div>
    <label class="f">Параметры после команды</label><input type="text" id="cl_flags" value="${e((C.agents.claude.flags||"").replace("--dangerously-skip-permissions","").trim())}">
    <label class="row" style="margin-top:6px"><input type="checkbox" id="cl_skip" ${C.agents.claude.skip_permissions?"checked":""}> Без запросов разрешений по умолчанию (--dangerously-skip-permissions)</label>
    <label class="f">Прокси новых сессий (заменяет префикс)</label>${pick("cl_proxy",C.agents.claude.proxy)}</div>
   <div class="card"><b>Codex</b>
    <label class="f">Префикс</label><input type="password" id="cx_prefix" value="${e(C.agents.codex.prefix)}">
    <label class="f">Параметры</label><input type="text" id="cx_flags" value="${e(C.agents.codex.flags)}">
    <label class="f">Прокси новых сессий (заменяет префикс)</label>${pick("cx_proxy",C.agents.codex.proxy)}</div>
   ${EXTRA_AGENTS.map(([key,name])=>`<div class="card"><b>${name}</b>
    <label class="f">Префикс</label><input type="password" id="${key}_prefix" value="${e(C.agents[key].prefix)}">
    <label class="f">Параметры</label><input type="text" id="${key}_flags" value="${e(C.agents[key].flags)}">
    <label class="f">Прокси новых сессий (заменяет префикс)</label>${pick(`${key}_proxy`,C.agents[key].proxy)}</div>`).join("")}
   <div class="mut">Команда запуска (пароль скрыт):</div><pre id="pv"></pre></div>`;
  h+=`<div class="s"><h3>Где открывать сессии</h3><div class="row"><span class="chip ${C.open_in==="window"?"on":""}" data-w="window">Новое окно</span><span class="chip ${C.open_in==="tab"?"on":""}" data-w="tab">Вкладка текущего окна</span></div></div>`;
  h+=`<div class="s"><h3>Вкладки боковой панели</h3>${Object.keys(TABS).map(k=>`<label class="row"><input type="checkbox" data-t="${k}" ${C.tabs[k]?"checked":""} > ${e(TABS[k])}</label>`).join("")}
   <label class="row" style="margin-top:6px"><input type="checkbox" id="autoshow" ${C.auto_show_toolbelt!==false?"checked":""}> Показывать панель в каждом новом окне</label>
   <label class="row"><input type="checkbox" id="autosave" ${C.autosave!==false?"checked":""}> Автосохранение снимка всех окон каждые 5 минут</label>
   <label class="f">Префикс названий вкладок для отличия от встроенных инструментов iTerm2</label><input type="text" id="prefix" value="${e(C.title_prefix)}" style="width:80px">
   <div class="mut">После изменения вкладок сервис автоматически перезапустится при сохранении</div></div>`;
  const kn=C.keenetic||{};
  h+=`<div class="s" id="network"><h3>Сеть</h3>
   <div class="mut">Прокси проверяются раз в минуту по API агентов. Во вкладке «Действия агента» доступны ⧉ копировать / ▶ claude / ▶ codex. Данные хранятся локально; пароли в URL прокси маскируются и сохраняются, пока вы не введёте новый URL.</div>
   <div class="card"><b>Прокси</b><div id="pxs">${(C.proxies||[]).map(pxRow).join("")}</div><button id="addpx">+ прокси</button></div>
   <div class="card"><b>Серверы</b> <span class="mut">Ping и TCP-проверка с этого Mac; отключите чтение приветствия для портов без SSH (MTProto, VPN)</span><div id="svs">${(C.servers||[]).map(svRow).join("")}</div><button id="addsv">+ сервер</button></div>
   <div class="card"><b>Роутер Keenetic</b> <span class="mut">Необязательно: туннели и маршруты доменов через RCI; пустой адрес отключает проверку</span>
    <div class="row"><input type="text" id="kn_host" placeholder="192.168.1.1" value="${e(kn.host||"")}" style="width:130px"><input type="text" id="kn_login" placeholder="admin" value="${e(kn.login||"")}" style="width:90px"><input type="password" id="kn_pass" placeholder="${kn.password_set?"Пароль не изменён":"Пароль"}"></div></div></div>`;
  h+=`<div class="s"><h3>Проверки репозитория</h3><div class="mut">Собственные проверки во вкладке «Git и PR»: если <code>file</code> существует в корне репозитория, выполняется <code>cmd</code>. Код выхода 0 — зелёный, остальные — красные.</div>
   <textarea id="checks" spellcheck="false">${e(JSON.stringify(C.repo_checks||[],null,1))}</textarea>
   <div class="mut">Пример: [{"name":"Контейнеры","file":"docker-compose.yml","cmd":"docker compose ps","max_lines":6}]</div></div>`;
  h+=`<div class="s mut">версия ${e(d.version)} · конфигурация ${e(d.config_file)}</div>`;
  document.getElementById("app").outerHTML=`<div id="app">${h}</div>`;
  const $=id=>document.getElementById(id);
  $("show").onclick=()=>{const t=$("cl_prefix").type==="password"?"text":"password";["cl_prefix","cx_prefix",...EXTRA_AGENTS.map(([key])=>`${key}_prefix`)].forEach(id=>$(id).type=t);$("show").textContent=t==="text"?"скрыть":"показать"};
  ["cl_prefix","cl_flags","cx_prefix","cx_flags",...EXTRA_AGENTS.flatMap(([key])=>[`${key}_prefix`,`${key}_flags`])].forEach(id=>$(id).oninput=()=>{collect();preview()});
  $("cl_skip").onchange=()=>{collect();preview()};
  document.querySelectorAll("[data-w]").forEach(n=>n.onclick=()=>{C.open_in=n.dataset.w;document.querySelectorAll("[data-w]").forEach(m=>m.classList.toggle("on",m===n))});
  $("addpx").onclick=()=>$("pxs").insertAdjacentHTML("beforeend",pxRow({}));
  $("addsv").onclick=()=>$("svs").insertAdjacentHTML("beforeend",svRow({}));
  document.getElementById("network").addEventListener("click",ev=>{if(ev.target.classList.contains("del"))ev.target.closest(".row").remove()});
  ["cl_proxy","cx_proxy",...EXTRA_AGENTS.map(([key])=>`${key}_proxy`)].forEach(id=>$(id).onchange=()=>{collect();preview()});
  if($("done"))$("done").onclick=async()=>{C.onboarded=true;await save(true);document.getElementById("agents").scrollIntoView({behavior:"smooth"})};
  preview();
  if(location.hash)setTimeout(()=>document.querySelector(location.hash)?.scrollIntoView({behavior:"smooth"}),50);
}
function collect(){const $=id=>document.getElementById(id);
  C.agents.claude.prefix=$("cl_prefix").value.trim();C.agents.claude.flags=$("cl_flags").value.trim();C.agents.claude.skip_permissions=$("cl_skip").checked;
  C.agents.codex.prefix=$("cx_prefix").value.trim();C.agents.codex.flags=$("cx_flags").value.trim();
  C.agents.claude.proxy=$("cl_proxy").value;C.agents.codex.proxy=$("cx_proxy").value;
  EXTRA_AGENTS.forEach(([key])=>{C.agents[key].prefix=$(`${key}_prefix`).value.trim();C.agents[key].flags=$(`${key}_flags`).value.trim();C.agents[key].proxy=$(`${key}_proxy`).value})}
async function save(quiet){const $=id=>document.getElementById(id);const msg=$("msg");
  collect();
  document.querySelectorAll("[data-t]").forEach(n=>C.tabs[n.dataset.t]=n.checked);
  C.title_prefix=$("prefix").value;C.auto_show_toolbelt=$("autoshow").checked;C.autosave=$("autosave").checked;
  let checks;try{checks=JSON.parse($("checks").value||"[]");if(!Array.isArray(checks))throw 0}catch(_){msg.innerHTML='<span class="bad">Проверки: требуется JSON-массив</span>';return}
  const proxies=[...document.querySelectorAll(".px")].map(r=>({orig:r.dataset.orig,name:r.querySelector(".pn").value.trim(),url:r.querySelector(".pu").value.trim()}));
  const servers=[...document.querySelectorAll(".sv")].map(r=>({name:r.querySelector(".sn").value.trim(),host:r.querySelector(".sh").value.trim(),port:r.querySelector(".sp2").value.trim()||22,banner:r.querySelector(".sb").checked?undefined:false}));
  const keenetic={host:$("kn_host").value.trim(),login:$("kn_login").value.trim(),password:$("kn_pass").value};
  const body={autosave:C.autosave,auto_show_toolbelt:C.auto_show_toolbelt,open_in:C.open_in,title_prefix:C.title_prefix,onboarded:C.onboarded,agents:C.agents,tabs:C.tabs,repo_checks:checks,proxies,servers,keenetic};
  const r=await (await fetch("/settings/save",{method:"POST",headers:{"X-Toolbelt":"1","Content-Type":"application/json"},body:JSON.stringify(body)})).text();
  if(r==="restart"){msg.innerHTML='<span class="warn">Перезапуск: вкладки обновятся через несколько секунд…</span>';setTimeout(()=>location.reload(),4000)}
  else if(r==="ok"){msg.innerHTML=quiet?"":'<span class="ok">Сохранено</span>';if(!quiet){setTimeout(()=>msg.textContent="",2500);load()}}
  else msg.innerHTML=`<span class="bad">${e(r)}</span>`}
document.getElementById("save").onclick=()=>save(false);
async function load(){try{const d=await (await fetch("/settings/state")).json();V=d.v;render(d)}catch(_){setTimeout(load,1500)}}
load();
</script></body></html>
